name: Build Tauri Android APK
on:
  push:
    branches: [ "main" ] # আপনার ব্রাঞ্চের নাম (main বা master) অনুযায়ী ঠিক করে নিন
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK and licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install Node Dependencies
        run: npm install

      - name: Init Android project
        run: npx tauri android init

      # --- ১. কী ডিকোড করা ---
      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEY_BASE64 }}" | base64 -d > ${{ github.workspace }}/my-release-key.jks

      # --- ২. Tauri বিল্ড করা (এখানে Unsigned APK তৈরি হবে) ---
      - name: Build APK
        run: npx tauri android build --apk

      # --- ৩. zipalign করা (সাইন করার আগে বাধ্যতামূলক) ---
      - name: Zipalign APK
        run: |
          cd src-tauri/gen/android/app/build/outputs/apk/universal/release/
          
          if [ -f "app-universal-release-unsigned.apk" ]; then
            INPUT_APK="app-universal-release-unsigned.apk"
          else
            INPUT_APK="app-universal-release.apk"
          fi
          
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v -p 4 $INPUT_APK app-universal-release-aligned.apk

      # --- ৪. apksigner দিয়ে সাইন করা ---
      - name: Sign APK
        run: |
          cd src-tauri/gen/android/app/build/outputs/apk/universal/release/
          
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks ${{ github.workspace }}/my-release-key.jks \
            --ks-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.ANDROID_KEY_PASSWORD }} \
            --ks-key-alias ${{ secrets.ANDROID_KEY_ALIAS }} \
            --out app-universal-release-signed.apk \
            app-universal-release-aligned.apk

      # --- ৫. সাইন করা ফাইলটি আপলোড করা ---
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-signed.apk
